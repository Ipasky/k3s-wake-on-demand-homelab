# /etc/hpc-respaldo/fuentes.conf: qué copia hpc-respaldo (EXAMPLE: copy to config/hpc-respaldo-fuentes.conf)
#
#   pvc   <nombre>  <namespace>/<pvc>   volumen de K3s (se localiza solo en el disco)
#   ruta  <nombre>  /ruta/en/la/pi      fichero o carpeta de la Pi
#
# Las bases SQLite se vuelcan siempre con .backup (consistentes aunque estén en uso).
# Una fuente que aún no exista se omite con un aviso, sin romper la copia.

# --- prioridad alta ---------------------------------------------------------
pvc   ticket-scanner   ticket-scanner/ticket-scanner-datos     # bases + fotos de tiquets
pvc   authelia         auth/authelia-datos                     # passkeys, OTP, sesiones
ruta  panel-datos      /opt/despertador/datos                  # tráfico + historial forense
ruta  hpc-config       /home/raspberrypi/hpc-config            # repositorio de configuración
ruta  hpc-secretos     /home/raspberrypi/hpc-secretos          # secretos (ya cifrados con GPG)

# --- clúster y servicios ----------------------------------------------------
ruta  k3s-estado       /var/lib/rancher/k3s/server/db/state.db # base de datos de K3s
ruta  crowdsec-config  /etc/crowdsec
ruta  crowdsec-datos   /var/lib/crowdsec/data
pvc   beszel           beszel/beszel-data

# --- your own apps: one line per volume ------------------------------------
# pvc   my-app         my-app/my-app-data
