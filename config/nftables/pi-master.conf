#!/usr/sbin/nft -f
#
# /etc/nftables.conf: Cortafuegos de pi-master
#
# Política: denegar por defecto en INPUT.
#   - Los servicios web se publican SOLO por Traefik (443) y quedan detrás de Authelia.
#   - Los puertos directos (3000 Homepage, 8090 Beszel, 8095 panel) están CERRADOS:
#     abrirlos permitiría saltarse el portal de autenticación.
#   - Immich (2283) y FileBrowser (8082) ya no se abren directos: van por Traefik
#     (https://fotos… y https://archivos…) y sus puertos solo los alcanza el clúster.
#     Immich no pasa por Authelia (su app no sabe), pero solo se admite desde casa y la VPN.
#   - OJO: los servicios publicados por K3s (LoadBalancer/NodePort) NO pasan por la
#     cadena 'input', sino por 'forward' (el tráfico se redirige a la red de pods).
#     Por eso ahí solo se admiten los puertos de Traefik; si no, cerrar el 3000 o el
#     8090 en 'input' no serviría de nada.
#   - Reglas de K3s/Kubernetes (CNI, pods, servicios, API, flannel, kubelet).
#   - Al portal (80/443 de Traefik) solo llegan la VPN, el Windows de administración y
#     el móvil en casa (MOVIL, sin SSH ni kubectl),
#     tanto por 'input' como por 'forward'.
#   - Salida: la Pi no puede INICIAR conexiones al resto de la red de casa (aislamiento),
#     pero sí responder a lo que la entrada ha aceptado.
#
# NUNCA usar 'flush ruleset' aquí: borraría también las reglas de K3s.

table inet filter
delete table inet filter

table inet filter {

    # ----- Direcciones de confianza (edítalas si cambian) -----
    define ADMIN    = @@IP_ADMIN@@                   # Windows de administración
    define MOVIL    = @@IP_MOVIL@@                   # móvil en el Wi-Fi de casa: solo web
    define GATEWAY  = @@IP_ROUTER@@                     # router
    define NODOS    = { @@IP_FARADAY@@, @@IP_MUSTANG@@ }  # faraday, mustang
    define LAN_CASA = @@RED_CASA@@                  # red doméstica
    define VPN      = @@RED_VPN@@                   # subred WireGuard

    # ----- Redes internas de K3s (por defecto en flannel) -----
    define K8S_PODS = 10.42.0.0/16                    # red de pods
    define K8S_SVC  = 10.43.0.0/16                    # red de servicios

    # ----- Puertos publicados -----
    define WEB      = { 80, 443 }                     # Traefik (todo lo demás va por aquí)
    # (2283/Immich y 8082/FileBrowser: solo desde el clúster, por Traefik; ver arriba)

    # ===================== ENTRADA =====================
    chain input {
        type filter hook input priority 0; policy drop;

        # Tráfico local
        iif "lo" accept

        # Conexiones ya establecidas / relacionadas
        ct state established,related accept
        ct state invalid drop

        # ICMP (ping) para diagnóstico
        ip protocol icmp icmp type echo-request accept
        ip6 nexthdr ipv6-icmp accept

        # DHCP cliente (para renovar la IP reservada)
        udp sport 67 udp dport 68 accept

        # WireGuard: puerto de la VPN (llega desde internet vía router)
        udp dport 51820 accept

        # ---------------- Por la VPN: solo el proxy y SSH ----------------
        iifname "wg0" tcp dport $WEB accept
        iifname "wg0" tcp dport 22 accept
        iifname "wg0" ip protocol icmp accept

        # ---------------- Desde el Windows de administración ----------------
        ip saddr $ADMIN tcp dport 22 accept
        ip saddr $ADMIN tcp dport $WEB accept
        ip saddr $ADMIN tcp dport 6443 accept          # API de Kubernetes (kubectl)

        # ---------------- Desde el móvil en casa (sin VPN) ----------------
        # Solo el portal y las apps. Ni SSH ni kubectl: eso queda para el Windows.
        ip saddr $MOVIL tcp dport $WEB accept

        # ---------------- K3s / Kubernetes ----------------
        iifname "cni0"      accept
        iifname "flannel.1" accept
        ip saddr $K8S_PODS accept
        ip saddr $K8S_SVC  accept
        ip saddr $NODOS tcp dport 6443  accept
        ip saddr $NODOS udp dport 8472  accept         # flannel VXLAN
        ip saddr $NODOS tcp dport 10250 accept         # kubelet

        # ruido de difusión de casa: fuera, sin registrar
        meta pkttype { broadcast, multicast } drop
        # lo demás se registra con margen suficiente para detectar escaneos
        limit rate 30/second burst 60 packets log prefix "nft-input-drop: "
        drop
    }

    # ===================== REENVÍO =====================
    chain forward {
        type filter hook forward priority 0; policy drop;

        # Conexiones ya iniciadas
        ct state established,related accept

        # Tráfico que nace dentro del clúster (pods hacia fuera y entre ellos)
        iifname "cni0"      accept
        iifname "flannel.1" accept
        ip saddr $K8S_PODS  accept

        # Entrada a los servicios del clúster SOLO por los puertos de Traefik.
        # 'ct original proto-dst' mira el puerto ORIGINAL, antes de la redirección
        # interna de Kubernetes, que es lo que pidió el cliente.
        # Y solo desde los mismos orígenes que la entrada: VPN y Windows de administración.
        # (Sin esto, cualquier aparato de casa llegaba al portal; cloudflared no lo
        # necesita porque su conexión sale de la propia Pi.)
        iifname "wg0"   ip daddr $K8S_PODS ct original proto-dst { 80, 443 } accept
        ip saddr $ADMIN ip daddr $K8S_PODS ct original proto-dst { 80, 443 } accept
        ip saddr $MOVIL ip daddr $K8S_PODS ct original proto-dst { 80, 443 } accept

        # Lo demás (3000 Homepage, 8090 Beszel, NodePorts sueltos...) se descarta:
        # esos servicios se alcanzan por su nombre en https, detrás de Authelia.
        limit rate 5/minute log prefix "nft-forward-drop: "
    }

    # ===================== SALIDA =====================
    chain output {
        type filter hook output priority 0; policy accept;

        # Las respuestas a lo que la entrada ya aceptó siempre pueden salir (p. ej. el
        # ping de un aparato de casa). La Pi sigue sin poder INICIAR nada hacia la red
        # de casa: eso lo corta la regla de LAN_CASA de abajo.
        ct state established,related accept

        ip daddr $GATEWAY accept
        ip daddr $NODOS   accept
        ip daddr $ADMIN   accept

        # Bloquear el resto de la red de casa (aislamiento de la Pi)
        ip daddr $LAN_CASA drop
    }
}
