#!/usr/sbin/nft -f
#
# /etc/nftables.conf: Cortafuegos de FARADAY (nodo agente K3s, CPU)
#
# Rol: nodo de cómputo. Sus NodePort solo son accesibles desde el master y el otro nodo.
# Rol original: Debe hablar con el master (Pi) y el otro nodo (Mustang)
# para que K3s funcione, salir a internet, y quedar aislado del resto de la casa.

# Solo se reemplaza NUESTRA tabla: las reglas de K3s (kube-proxy, flannel, svclb) no se tocan
table inet filter
delete table inet filter

table inet filter {

    # ----- Direcciones de confianza -----
    define ADMIN    = @@IP_ADMIN@@                  # Windows de administración
    define GATEWAY  = @@IP_ROUTER@@                     # router
    define MASTER   = @@IP_PI@@                    # pi-master
    define MUSTANG  = @@IP_MUSTANG@@                    # otro nodo
    define CLUSTER  = { @@IP_PI@@, @@IP_MUSTANG@@ } # master + nodos (sin Faraday)
    define LAN_CASA = @@RED_CASA@@                  # red doméstica

    # ----- Redes internas de K3s -----
    define K8S_PODS = 10.42.0.0/16
    define K8S_SVC  = 10.43.0.0/16

    # ===================== ENTRADA =====================
    chain input {
        type filter hook input priority 0; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        # ICMP (ping) para diagnóstico
        ip protocol icmp icmp type echo-request accept
        ip6 nexthdr ipv6-icmp accept

        # DHCP cliente
        udp sport 67 udp dport 68 accept

        # SSH solo desde el Windows de administración
        ip saddr $ADMIN tcp dport 22 accept

        # ---------------- K3s / Kubernetes (nodo agente) ----------------
        # Confiar en las interfaces internas del clúster
        iifname "cni0"      accept
        iifname "flannel.1" accept
        # Redes de pods y servicios
        ip saddr $K8S_PODS accept
        ip saddr $K8S_SVC  accept
        # Todo el tráfico desde el master y el otro nodo (flannel, kubelet, etc.)
        ip saddr $CLUSTER accept
        # Beszel: el hub (en el master) consulta al agente en el 45876
        ip saddr $MASTER tcp dport 45876 accept
        # ----------------------------------------------------------------

        # Registrar (con límite) y descartar el resto
        limit rate 5/minute log prefix "nft-faraday-drop: "
        drop
    }

    # ===================== REENVÍO =====================
    chain forward {
        type filter hook forward priority 0; policy drop;

        # Conexiones ya iniciadas
        ct state established,related accept

        # Tráfico que nace dentro del clúster
        iifname "cni0"      accept
        iifname "flannel.1" accept
        ip saddr $K8S_PODS  accept

        # A los servicios de este nodo (NodePort) solo entran el master y el otro nodo.
        # Así el despertador de la Pi sigue alcanzando Immich y los archivos, pero los
        # NodePort dejan de ser accesibles desde la red de casa.
        ip saddr $CLUSTER ip daddr $K8S_PODS accept

        # El resto se descarta: los servicios se usan por https, detrás del portal.
        limit rate 5/minute log prefix "nft-forward-drop: "
    }

    # ===================== SALIDA =====================
    chain output {
        type filter hook output priority 0; policy accept;

        # Permitir salida hacia gateway, master, nodos y admin
        ip daddr $GATEWAY accept
        ip daddr $CLUSTER accept
        ip daddr $ADMIN   accept

        # Bloquear el resto de la red de casa (AISLAMIENTO)
        ip daddr $LAN_CASA drop

        # El resto (internet, pods/servicios) sale por defecto (policy accept)
    }
}
