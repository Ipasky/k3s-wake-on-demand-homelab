# Middleware de forward-auth + publicación de Beszel detrás del portal.
# El Middleware se crea EN EL MISMO namespace del servicio (Traefik no cruza
# namespaces por defecto); se repetirá igual para cada servicio protegido.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authelia
  namespace: beszel
spec:
  forwardAuth:
    address: http://authelia.auth.svc.cluster.local:9091/api/authz/forward-auth
    trustForwardHeader: true
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Email
      - Remote-Name
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: beszel
  namespace: beszel
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`metricas.@@DOMINIO@@`)
      kind: Rule
      middlewares:
        - name: authelia
      services:
        - name: beszel-hub
          port: 8090
  tls: {}
